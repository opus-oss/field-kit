<style>
/* Opus — Prima Materia : cold slate ground · monospace metadata · serif headlines · tempered-amber accent */
:root{
  color-scheme:light;
  --bg:#e0cfb0; --card:#e8d9bf; --chip:#d4c29e; --raised:#eee1cb;
  --ink:#2b2114; --mut:#5f5236; --faint:#8a7c5e; --line:color-mix(in srgb,#1e160e 12%,transparent); --line2:color-mix(in srgb,#1e160e 24%,transparent);
  --acc:#b0631f; --good:#14776a; --warn:#8a6410; --bad:#b23e37; --blue:#3f6a94; --vio:#6d5a9c;
  --h1:color-mix(in srgb,var(--acc),#000 26%); --h2:#3d6e63; --h3:#44618c; --h4:#71537f; --h5:#5c7150; --on-acc:#fffaf0;
  --mono:"SF Mono","JetBrains Mono","Menlo",ui-monospace,"Consolas",monospace;
  --codechip:#f6efe0; --codeink:color-mix(in srgb,var(--acc) 38%,var(--ink));
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root:not([data-theme="light"]){
    --codechip:#101314; --codeink:color-mix(in srgb,var(--acc) 62%,var(--ink));
    --h1:color-mix(in srgb,var(--acc),#fff 16%); --h2:#7cb5a4; --h3:#8fa8c9; --h4:#ab8fc0; --h5:#97ab8a; --on-acc:#1b1e1f;
    --bg:#1b1e1f; --card:#222627; --chip:#292e2f; --raised:#2e3334;
    --ink:#e7e4d9; --mut:#b1afa1; --faint:#828175; --line:#353b3c; --line2:#434a4b;
    --acc:#d98a3d; --good:#4bbfa6; --warn:#c8971f; --bad:#d0655c; --blue:#7fa6cc; --vio:#a896d6;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%; scroll-padding-top:110px}
body{background:var(--bg); color:var(--ink); font:16px/1.55 var(--sans); min-height:100vh}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
a{color:inherit; text-decoration:none}

/* ---- suite bar (shared across the toolkit) ---- */
.suitebar{position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:10px; background:var(--card); border-bottom:1px solid var(--line); padding:7px 12px; overflow:visible; height:42px}
.suitebar::-webkit-scrollbar{display:none}
.suitebar .brand{font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.05em; color:var(--acc); white-space:nowrap; flex-shrink:0}
.suitebar .switch{display:flex; gap:3px}
.suitebar .switch a{font-family:var(--mono); font-size:12.5px; padding:5px 10px; border-radius:8px; color:var(--mut); white-space:nowrap}
.suitebar .switch a:hover{color:var(--ink)}
.suitebar .switch a.on{background:var(--chip); color:var(--h1); box-shadow:inset 0 -2px 0 var(--acc)}
.suitebar .grp{position:relative}
.suitebar .gbtn{font-family:var(--mono); font-size:12.5px; padding:5px 10px; border-radius:8px; color:var(--mut); background:transparent; border:0; white-space:nowrap; display:flex; align-items:center; gap:5px}
.suitebar .gbtn:hover{color:var(--ink)}
.suitebar .gbtn .car{font-size:9px; opacity:.7}
.suitebar .grp.on .gbtn{background:var(--chip); color:var(--h1); box-shadow:inset 0 -2px 0 var(--acc)}
.suitebar .switch{align-items:center}
.suitebar .menu{position:absolute; top:calc(100% + 6px); left:0; min-width:150px; background:var(--card); border:1px solid var(--line2); border-radius:10px; padding:5px; display:none; flex-direction:column; gap:2px; box-shadow:0 10px 24px -12px rgba(0,0,0,.5); z-index:70}
.suitebar .grp.open .menu{display:flex}
.suitebar .menu a{padding:6px 10px; border-radius:7px}
.suitebar .menu a:hover{background:var(--chip); color:var(--ink)}
.suitebar .menu a.cur{color:var(--h1); background:var(--chip)}
@media(max-width:440px){
  .suitebar{gap:6px; padding:7px 8px}
  .suitebar .brand{font-size:0}
  .suitebar .brand::before{content:'◆'; font-size:14px}
  .suitebar .switch a,.suitebar .gbtn{padding:5px 7px; font-size:12px}
  .suitebar .gbtn .car{display:none}
}
.suitebar .themebtn{margin-left:auto; position:sticky; right:0; flex-shrink:0; font-size:15px; line-height:1; padding:5px 9px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--mut); cursor:pointer; box-shadow:-10px 0 8px -2px var(--card)}
.suitebar .themebtn:hover{color:var(--acc); border-color:var(--line2)}

.wrap{max-width:1180px; margin:0 auto; padding:0 18px 60px}
.mast{padding:24px 0 6px}
.mast h1{font-family:var(--mono); font-size:2rem; font-weight:700; letter-spacing:-.02em; color:var(--h1)}
.mast p{color:var(--mut); font-size:14.5px; margin-top:4px}
.search{display:flex; gap:8px; margin:16px 0 10px}
.search input{flex:1; min-width:0; font:15px var(--mono); padding:11px 13px; border-radius:10px; border:1px solid var(--line2); background:var(--card); color:var(--ink)}
.search input:focus{outline:none; border-color:var(--acc)}
.search button{font-family:var(--mono); font-weight:700; font-size:14px; padding:0 18px; border-radius:10px; background:var(--acc); color:var(--on-acc)}
.eg{font:12.5px var(--mono); color:var(--faint)}
.eg a{color:var(--mut); border-bottom:1px dotted var(--line2); cursor:pointer; margin-left:14px}
.ticks{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:12px 0 0; font:12px var(--mono); color:var(--faint)}
.ticks:not(:empty)::before{content:'Sources checked'; color:var(--mut); font-weight:600; margin-right:4px}
.ticks span{padding:3px 8px; border-radius:7px; background:var(--chip)}
.ticks .ok{color:var(--good)} .ticks .bad{color:var(--bad)}
.helper{font:12.5px var(--mono); color:var(--faint); margin-top:8px}
.helper b{color:var(--mut)} .helper code{color:var(--codeink); background:var(--codechip); padding:1px 5px; border-radius:5px}
.summary{font-size:17px; line-height:1.6; margin:20px 0 6px; max-width:900px}
.summary b{color:var(--h1); font-weight:600}
h2{font-family:var(--mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--h2); margin:26px 0 10px}
.flowbox{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; overflow-x:auto}
.flowbox svg{display:block; min-width:820px; width:100%; height:auto}
.n-box{fill:var(--raised); stroke:var(--line2); stroke-width:1}
.n-box.hot{stroke:var(--acc); stroke-width:1.6}
.n-k{font:600 10.5px var(--mono); fill:var(--faint); letter-spacing:.08em; text-transform:uppercase}
.n-v{font:700 15px var(--mono); fill:var(--ink)}
.n-d{font:12px var(--sans); fill:var(--mut)}
.e{fill:none; stroke:var(--line2)} .e.hot{stroke:var(--acc)}
.cut-b{fill:color-mix(in srgb,var(--bad) 16%,var(--card)); stroke:var(--bad); stroke-width:1}
.cut-t{font:600 11px var(--mono); fill:var(--bad)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; align-items:start}
.card.wide{grid-column:1/-1}
.grid > .quiet{grid-column:1/-1}
.quiet{font:13px var(--mono); color:var(--faint); margin:4px 0}
.qlabel{font:600 11px var(--mono); color:var(--faint)}
.q a{font:11px var(--mono); padding:4px 8px; border-radius:6px; background:var(--chip); color:var(--mut)}
.fam{font:700 15px var(--mono); color:var(--bad)}
table.tight td{padding:3px 6px}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.card h3{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--h3); margin-bottom:8px}
.kv{display:grid; grid-template-columns:118px 1fr; gap:4px 10px; font-size:14px}
.kv dt{color:var(--faint); font:12.5px var(--mono); padding-top:2px}
.kv dd{word-break:break-word}
.mono{font-family:var(--mono); font-size:13px}
.pill{display:inline-block; font:12px var(--mono); padding:1px 7px; border-radius:6px; background:var(--chip); margin:1px 3px 1px 0}
.pill.bad{color:var(--bad)} .pill.good{color:var(--good)} .pill.warn{color:var(--warn)}
.note{color:var(--mut); font-size:13.5px; margin-top:8px}
.cuts{display:grid; gap:10px}
.cut{display:grid; grid-template-columns:34px 1fr; gap:10px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--bad); border-radius:12px; padding:12px 14px}
.cut .num{font:700 18px var(--mono); color:var(--bad)}
.cut b{font-weight:600}
.cut p{color:var(--mut); font-size:14px; margin-top:3px}
table{width:100%; border-collapse:collapse; font-size:13px}
td,th{text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top}
th{font:600 11px var(--mono); color:var(--faint); text-transform:uppercase; letter-spacing:.06em}
td.mono{font-size:12.5px; white-space:nowrap}
td.url{font:12.5px var(--mono); word-break:break-all}
.nw{white-space:nowrap}
.intel{display:flex; flex-direction:column; gap:12px}
.intel .card{margin:0; min-width:0; overflow-x:auto}
.grid > *{min-width:0}
.flow2{columns:2 420px; column-gap:12px}
.flow2 > .card{break-inside:avoid; margin:0 0 12px; display:inline-block; width:100%}
.verdict{display:flex; flex-wrap:wrap; gap:14px 48px; align-items:flex-start}
.intel .quiet{margin:0}
.q{display:grid; grid-template-columns:64px minmax(0,1fr) auto auto; gap:6px; align-items:center; margin:5px 0}
.q code{min-width:0; font:12px var(--mono); background:var(--codechip); color:var(--codeink); padding:5px 7px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tl text{font:11.5px var(--mono); fill:var(--mut)}
.tl .ax{font-size:10.5px; fill:var(--faint)}
.tl .bar{fill:var(--line2)} .tl .bar.cur{fill:var(--acc)}
.links a{display:inline-block; font:12.5px var(--mono); padding:4px 9px; margin:2px 4px 2px 0; border-radius:7px; background:var(--chip); color:var(--mut)}
.links a:hover{color:var(--acc)}
.cp{font:11px var(--mono); padding:2px 6px; border-radius:5px; background:var(--chip); color:var(--mut)}
.q button{font:11px var(--mono); padding:4px 8px; border-radius:6px; background:var(--chip); color:var(--mut)}
.err{color:var(--bad); font:13px var(--mono)}
.muted{color:var(--faint)}
.go{cursor:pointer; border-bottom:1px dotted var(--line2)}
.go:hover{color:var(--acc)}
@media(max-width:600px){.summary{font-size:15.5px} .kv{grid-template-columns:96px 1fr}}
</style>

    <h1>Pivot</h1>
  </div>
  <form class="search" id="f" autocomplete="off">
    <input id="q" placeholder="IP, domain, or ASN (defanged is fine)" spellcheck="false" autocapitalize="off">
    <button type="submit">Pivot</button>
  </form>
  <div class="eg">try <a data-q="1.1.1.1">1.1.1[.]1</a><a data-q="AS13335">AS13335</a><a data-q="example.com">example[.]com</a></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const defang = s => String(s ?? '').replace(/\.(?=[^.]*$)/, '[.]');
const fmt = n => Number(n).toLocaleString();
const today = new Date().toISOString().slice(0,10);

/* ---------- fetch helpers ---------- */
async function getJSON(url, ms = 20000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal: c.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const ripe = (call, p, ms = 30000) => getJSON(`https://stat.ripe.net/data/${call}/data.json?${new URLSearchParams({...p, sourceapp: 'fieldkit-pivot'})}`, ms).then(j => j.data);
const TYPES = {A:1, NS:2, PTR:12, MX:15, TXT:16, AAAA:28};
async function doh(name, type) {
  const j = await getJSON(`https://dns.google/resolve?name=${encodeURIComponent(name)}&type=${type}`, 10000);
  return (j.Answer || []).filter(a => a.type === TYPES[type]).map(a => a.data.replace(/^"|"$/g, '').replace(/\.$/, ''));
}

let tickBox;
function tick(name, p) {
  const s = document.createElement('span'); s.textContent = name + ' …'; tickBox.appendChild(s);
  return p.then(v => { s.textContent = name + ' ✓'; s.className = 'ok'; return v; },
                e => { s.textContent = name + ' (unavailable)'; s.className = 'bad'; s.title = e.message; return {error: e.message}; });
}
const bad = x => !x || x.error;

/* ---------- local helper (keys stay on the Mac) ---------- */
const HELPER = (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.protocol === 'http:') ? '' :
  (localStorage.getItem('fk_pivot_helper') || 'http://127.0.0.1:8787');
let helperOn = false;
async function pingHelper() {
  try { const j = await getJSON(HELPER + '/api/ping', 1500); helperOn = !!j.ok;
    $('#helper').innerHTML = `<b>Local helper on.</b> VirusTotal, abuse.ch, passive DNS and certificates included${j.keys.length ? '' : ' (no API keys configured)'}.`;
  } catch (e) { $('#helper').innerHTML = ''; }
}

/* ---------- sources ---------- */
function v4int(ip) { return ip.split('.').reduce((a, o) => a * 256 + +o, 0); }
function inPrefix(ip, pfx) {
  if (ip.includes(':') || pfx.includes(':')) return pfx.includes(':') === ip.includes(':');
  const [net, len] = pfx.split('/'); const size = 2 ** (32 - +len);
  return Math.floor(v4int(ip) / size) === Math.floor(v4int(net) / size);
}
async function cymruIP(ip) {
  if (!ip.includes(':')) {
    const [r] = await doh(ip.split('.').reverse().join('.') + '.origin.asn.cymru.com', 'TXT');
    if (r) { const [a, prefix, cc, reg, alloc] = r.split('|').map(s => s.trim());
      return {asn: a.split(' ')[0], prefix, cc, reg, alloc, src: 'Team Cymru'}; }
  }
  const d = await ripe('prefix-overview', {resource: ip});
  if (!d.asns || !d.asns.length) throw new Error('not announced');
  return {asn: String(d.asns[0].asn), prefix: d.resource, src: 'RIPEstat'};
}
const nameCache = {};
async function asName(n) {
  if (nameCache[n]) return nameCache[n];
  let r = null;
  try { const [t] = await doh(`AS${n}.asn.cymru.com`, 'TXT');
    if (t) { const p = t.split('|').map(s => s.trim()); r = {name: p[4], cc: p[1], reg: p[2], alloc: p[3]}; } } catch (e) {}
  if (!r) { try { r = {name: (await ripe('as-overview', {resource: 'AS' + n})).holder}; } catch (e) { r = {name: ''}; } }
  return nameCache[n] = r;
}
const shortName = s => (s || '').replace(/^[A-Za-z0-9_.-]+ - /, '').replace(/,\s*[A-Z]{2}$/, '');

function mergeSpans(tl) {
  const ts = tl.map(t => [t.starttime.slice(0,10), t.endtime.slice(0,10)]).sort();
  const out = [];
  for (const [s, e] of ts) {
    const last = out[out.length - 1];
    if (last && (new Date(s) - new Date(last[1])) / 864e5 <= 3) last[1] = e > last[1] ? e : last[1]; else out.push([s, e]);
  }
  return out;
}
async function prefixHistory(ip) {
  const d = await ripe('routing-history', {resource: ip});
  const rows = [];
  for (const o of d.by_origin || []) for (const p of o.prefixes) {
    if (+p.prefix.split('/')[1] < 12 || !inPrefix(ip, p.prefix)) continue;
    for (const [s, e] of mergeSpans(p.timelines)) rows.push({origin: String(o.origin), prefix: p.prefix, first: s, last: e});
  }
  return rows.sort((a, b) => a.first < b.first ? -1 : 1);
}
async function upstreams(asn, top = 6) {
  const d = await ripe('asn-neighbours', {resource: 'AS' + asn});
  const left = d.neighbours.filter(n => n.type === 'left').sort((a, b) => b.power - a.power);
  const total = left.reduce((a, n) => a + n.power, 0) || 1;
  const ups = await Promise.all(left.slice(0, top).map(async n => ({asn: String(n.asn), power: n.power, share: n.power / total, name: (await asName(n.asn)).name})));
  return {ups, nLeft: left.length, nRight: d.neighbours.filter(n => n.type === 'right').length};
}
async function footprint(asn) {
  const d = await ripe('announced-prefixes', {resource: 'AS' + asn});
  const v4 = d.prefixes.filter(p => !p.prefix.includes(':'));
  return {v4: v4.length, addrs: v4.reduce((a, p) => a + 2 ** (32 - +p.prefix.split('/')[1]), 0), v6: d.prefixes.length - v4.length,
          list: d.prefixes.map(p => ({prefix: p.prefix, since: (p.timelines[0] || {}).starttime?.slice(0,10)}))};
}
async function rpki(asn, prefix) { const d = await ripe('rpki-validation', {resource: 'AS' + asn, prefix}, 12000);
  return {status: d.status, roas: (d.validating_roas || []).map(r => `AS${r.origin} ${r.prefix} max /${r.max_length}`)}; }
const abuse = res => ripe('abuse-contact-finder', {resource: res}).then(d => d.abuse_contacts || []);
function vcard(e, f) { const v = (e.vcardArray || [null, []])[1].find(x => x[0] === f); return v ? v[3] : ''; }
async function rdapIP(ip) {
  const d = await getJSON('https://rdap.org/ip/' + ip);
  const ents = (d.entities || []).map(e => ({roles: e.roles || [], handle: e.handle || '', kind: vcard(e, 'kind'), name: vcard(e, 'fn') || e.handle}));
  // prefer the registrant organisation over maintainer handles (RIPE lists both as registrant)
  const regs = ents.filter(e => e.roles.includes('registrant') && !/-MNT$/i.test(e.handle));
  const org = (regs.find(e => e.kind === 'org' || /^ORG-/i.test(e.handle)) || regs[0] || {}).name || '';
  return {netname: d.name, range: d.startAddress ? `${d.startAddress} – ${d.endAddress}` : d.handle, country: d.country, org, ents};
}
async function rdapDomain(dom) {
  const d = await getJSON('https://rdap.org/domain/' + dom);
  const ev = Object.fromEntries((d.events || []).map(e => [e.eventAction, e.eventDate.slice(0,10)]));
  const reg = (d.entities || []).find(e => (e.roles || []).includes('registrar')) || {};
  const ab = (reg.entities || []).find(e => (e.roles || []).includes('abuse'));
  return {registrar: vcard(reg, 'fn') || reg.handle, abuse: ab ? vcard(ab, 'email') : '', created: ev.registration,
          updated: ev['last changed'], expires: ev.expiration, ns: (d.nameservers || []).map(n => n.ldhName.toLowerCase()), status: d.status || []};
}
async function internetdb(ip) {
  try { return await getJSON('https://internetdb.shodan.io/' + ip, 10000); }
  catch (e) { if (/404/.test(e.message)) return {none: true}; throw e; }
}
async function ptr(ip) {
  if (ip.includes(':')) return '';
  const [p] = await doh(ip.split('.').reverse().join('.') + '.in-addr.arpa', 'PTR'); return p || '';
}
async function extra(q) {
  if (!helperOn) return null;
  return getJSON(HELPER + '/api/extra?q=' + encodeURIComponent(q), 70000);
}

/* ---------- flow visual ---------- */
const _cv = document.createElement('canvas').getContext('2d');

      let i = w.length; while (i > 1 && !fits((line ? line + ' ' : '') + w.slice(0, i))) i--;
      if (i <= 1 && line) { out.push(line); line = ''; continue; }
      out.push((line ? line + ' ' : '') + w.slice(0, i)); line = ''; w = w.slice(i);
    }

  const colH = laid.map(col => col.reduce((a, b) => a + b.L.h, 0) + (col.length - 1) * vgap);
  const H = Math.max(240, Math.max(...colH) + 96);

    <defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--line2)"/></marker><marker id="arh" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--acc)"/></marker></defs>`;

}

/* ---------- timeline ---------- */
function svgTimeline(rows, curAsn) {

  const groups = {};
  for (const r of rows) (groups[r.origin + ' ' + r.prefix] ||= []).push(r);
  const keys = Object.keys(groups).slice(-12);
  const t0 = new Date(rows.reduce((a, r) => r.first < a ? r.first : a, today)).getTime(), t1 = Date.now();
  const W = 1120, L = 250, R = 20, rowH = 22, H = keys.length * rowH + 30;
  const X = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  let s = `<svg class="tl" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const y0 = new Date(t0).getFullYear(), y1 = new Date().getFullYear(), step = Math.max(1, Math.ceil((y1 - y0) / 10));
  for (let y = y0 + 1; y <= y1; y += step) { const x = X(`${y}-01-01`); s += `<line x1="${x}" x2="${x}" y1="0" y2="${H - 18}" stroke="var(--line)"/><text class="ax" x="${x - 14}" y="${H - 4}">${y}</text>`; }
  keys.forEach((k, i) => {
    const y = i * rowH + 4; const [o, p] = k.split(' ');
    s += `<text x="0" y="${y + 13}">AS${esc(o)}  ${esc(p)}</text>`;
    for (const r of groups[k]) s += `<rect class="bar${o === curAsn ? ' cur' : ''}" x="${X(r.first)}" y="${y + 3}" width="${Math.max(2, X(r.last) - X(r.first))}" height="13" rx="3"><title>AS${o} ${p}: ${r.first} to ${r.last}</title></rect>`;
  });

      '<table class="tight"><tr><th>sha256</th><th>family / label</th><th>name</th><th>type</th><th>det</th><th>first seen</th></tr>' +
      v.communicating_files.map(f => `<tr><td class="nw">${hashCell(f.sha256)}</td><td>${f.label ? `<span class="${f.mal ? 'err' : ''}">${esc(f.label)}</span>` : '<span class="muted">unlabeled</span>'}</td><td class="url muted">${esc((f.name || '').slice(0, 60))}</td><td>${esc(f.type || '')}</td><td class="mono">${f.mal ?? ''}</td><td class="mono">${esc(f.first)}</td></tr>`).join('') + '</table>' +
      ((ex.bazaar || []).length ? '<p class="note">MalwareBazaar: ' + ex.bazaar.map(b => `${esc(b.signature || 'unsigned')} (${esc(b.first)}${b.tags.length ? ', ' + b.tags.slice(0, 4).map(esc).join(', ') : ''})`).join('; ') + '</p>' : ''), 'wide'));
    if (v.skipped) quiet.push(`VirusTotal rate limit hit, skipped: ${esc(v.skipped.join(', '))}.`);
  } else if (ex.vt && (ex.vt.error || ex.vt.note)) quiet.push(`VirusTotal: ${esc(ex.vt.error || ex.vt.note)}.`);
  const tf = Array.isArray(ex.threatfox) ? ex.threatfox : [], uh = ex.urlhaus && !bad(ex.urlhaus) && !ex.urlhaus.note ? ex.urlhaus : null;
  if (tf.length) wide.push(card(`ThreatFox (${tf.length})`, '<table class="tight"><tr><th>indicator</th><th>malware</th><th>type</th><th>conf</th><th>first seen</th><th>last seen</th></tr>' +
    tf.map(t => `<tr><td class="url">${esc(defang(t.ioc))}</td><td><span class="err">${esc(t.malware)}</span>${t.tags.length ? '<br><span class="muted">' + t.tags.map(esc).join(', ') + '</span>' : ''}</td><td>${esc(t.type_desc || t.type)}</td><td class="mono">${t.conf}</td><td class="mono">${esc(t.first)}</td><td class="mono">${esc(t.last || '')}</td></tr>`).join('') + '</table>' +
    `<p class="note">${tf.find(t => t.reporter) ? 'Reported by ' + esc(tf.find(t => t.reporter).reporter) : ''}${tf.find(t => t.reference) ? ` · <a class="go" href="${esc(tf.find(t => t.reference).reference)}" target="_blank" rel="noopener noreferrer">source ↗</a>` : ''}</p>`, 'wide'));
  if (uh && uh.count) wide.push(card(`URLhaus (${uh.count})`, '<table class="tight"><tr><th>url</th><th>status</th><th>threat</th><th>added</th></tr>' +
    uh.urls.map(u => `<tr><td class="url">${esc(defang(u.url))}</td><td>${esc(u.status)}</td><td>${esc(u.threat || '')}${u.tags.length ? '<br><span class="muted">' + u.tags.map(esc).join(', ') + '</span>' : ''}</td><td class="mono">${esc(u.added)}</td></tr>`).join('') + '</table>', 'wide'));
  const none = [!tf.length ? 'no ThreatFox hits' : '', !(uh && uh.count) ? 'no URLhaus URLs' : '', !(ex.bazaar || []).length && v && (v.communicating_files || []).length ? 'no MalwareBazaar samples for the linked files' : ''].filter(Boolean);
  if (none.length) quiet.push(`abuse.ch: ${none.join(', ')}.`);
  const res = [];
  if (v && v.resolutions) for (const x of v.resolutions) res.push({first: x.date, last: '', host: x.host, ip: x.ip});
  if (ex.pdns && ex.pdns.rows) for (const x of ex.pdns.rows) if (x.type === 'a' || x.type === 'aaaa') res.push({first: x.first, last: x.last, host: x.q, ip: x.a});
  if (res.length) cols.push(card(`Passive DNS (${res.length})`, '<table class="tight"><tr><th>seen</th><th>domain</th><th>IP</th></tr>' +
    res.sort((a, b) => a.first < b.first ? 1 : -1).slice(0, 25).map(x => `<tr><td class="mono">${esc(x.first)}</td><td class="url">${go(x.host)}</td><td class="nw">${go(x.ip)}</td></tr>`).join('') + '</table>'));
  else quiet.push(`Passive DNS: ${isIP ? 'no domain has pointed here, so the certificate is the better anchor' : 'no resolutions on record'}.`);
  if (ex.crtsh) {
    if (bad(ex.crtsh)) quiet.push(`<span id="crtline">crt.sh didn’t answer. <button class="cp" data-crt="${esc(q)}">try again</button></span>`);
    else cols.push(card(`crt.sh (${ex.crtsh.certs} certs)`, `<div>${ex.crtsh.issuers.map(([i, n]) => `<span class="pill">${esc(i)} ${n}</span>`).join('')}</div>` +
      '<table class="tight"><tr><th>first cert</th><th>name</th></tr>' + ex.crtsh.names.slice(0, 25).map(([n, d]) => `<tr><td class="mono">${esc(d)}</td><td class="url">${go(n)}</td></tr>`).join('') + '</table>'));
  }
  return top.join('') + (cols.length ? `<div class="flow2">${cols.join('')}</div>` : '') + wide.join('') + quiet.map(x => `<p class="quiet">${x}</p>`).join('');
}

function ipCards(r) {
  let h = '';
  h += card('Hosting', bad(r.cy) ? err(r.cy) : kv([['network', `AS${r.cy.asn} ${esc(r.name && r.name.name || '')}`], ['block', `<span class="mono">${esc(r.cy.prefix)}</span>`],
    ['country', esc(r.cy.cc)], ['registry', esc(r.cy.reg)], ['allocated', esc(r.cy.alloc)],
    ['size', r.fp && !bad(r.fp) ? `${fmt(r.fp.v4)} IPv4 blocks · ${fmt(r.fp.addrs)} addresses · ${r.fp.v6} IPv6` : ''], ['PTR', r.rev ? esc(defang(r.rev)) : '<span class="muted">none</span>'],
    ['lookup', `<span class="muted">${esc(r.cy.src)}</span>`]]));
  if (!bad(r.rd)) {
    const announcer = (r.name && r.name.name || '').toLowerCase(), owner = `${r.rd.netname || ''} ${r.rd.org || ''}`.toLowerCase();
    const match = announcer.split(/[^a-z0-9]+/).some(w => w.length >= 4 && owner.includes(w));
    h += card('Owner on paper', kv([['netname', `<span class="mono">${esc(r.rd.netname)}</span>`], ['range', `<span class="mono">${esc(r.rd.range)}</span>`], ['country', esc(r.rd.country)],
      ['org', esc(r.rd.org)], ['vs announcer', match ? '<span class="pill good">matches</span> own space' : '<span class="pill warn">differs</span> possibly leased or brokered space']]) +
      (match ? '' : '<p class="note">The registered owner and the network announcing the block don’t look the same. Leased space is common; it also means the block can move to another host quickly.</p>'));
  } else h += card('Owner on paper', err(r.rd));
  h += card('RPKI', !r.rp || bad(r.rp) ? err(r.rp) : kv([['status', `<span class="pill ${r.rp.status === 'valid' ? 'good' : r.rp.status === 'invalid' ? 'bad' : 'warn'}">${esc(r.rp.status)}</span>`],
    ['ROAs', r.rp.roas.map(x => `<div class="mono">${esc(x)}</div>`).join('') || '<span class="muted">none</span>']]) +
    `<p class="note">${r.rp.status === 'valid' ? 'The owner signed off on this network announcing it.' : r.rp.status === 'invalid' ? 'The announcement breaks the owner’s signed statement. That is one sign of a hijack.' : 'No signed statement exists for this block. That is common for small hosts and weak evidence by itself.'}</p>`);
  const p = r.ports;
  h += card('Exposure (Shodan InternetDB)', bad(p) ? err(p) : p.none ? '<p class="note">No record. Shodan hasn’t seen open ports here recently.</p>' :
    kv([['ports', (p.ports || []).map(x => `<span class="pill">${x}</span>`).join('')], ['tags', (p.tags || []).map(x => `<span class="pill warn">${esc(x)}</span>`).join('')],
      ['hostnames', (p.hostnames || []).slice(0, 6).map(x => go(x)).join('<br>')], ['software', (p.cpes || []).slice(0, 6).map(x => `<div class="mono">${esc(x)}</div>`).join('')], ['CVEs', (p.vulns || []).length || '']]));
  return h;
}

function linksIP(ip, asn) {
  const L = [[`https://bgp.tools/prefix/${ip}`, 'bgp.tools'], [`https://bgp.he.net/ip/${ip}`, 'bgp.he.net'], [`https://www.virustotal.com/gui/ip-address/${ip}`, 'VirusTotal'],
    [`https://www.shodan.io/host/${ip}`, 'Shodan'], [`https://search.censys.io/hosts/${ip}`, 'Censys'], [`https://threatfox.abuse.ch/browse.php?search=ioc%3A${ip}`, 'ThreatFox'],
    [`https://app.validin.com/detail?find=${ip}&type=ip4`, 'Validin']];
  if (asn) L.push([`https://bgp.tools/as/${asn}`, `bgp.tools AS${asn}`]);
  return `<div class="links">${L.map(([u, t]) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t} ↗</a>`).join('')}</div>`;
}

function renderIP(r, dom) {
  let h = `<p class="summary">${summaryIP(r, dom)}</p>`;
  h += `<h2>How it reaches the internet</h2><div class="flowbox">${svgFlow(ipFlowCols(r, dom))}</div>`;
  if (!bad(r.cy)) h += `<p class="note">Percentages are each upstream's share of the routes seen by public route collectors. The highlighted path is the main one, and red tags mark where the chain can be cut.</p>`;
  h += `<h2>Where it can be cut off</h2><div class="cuts">${cutsHTML(r, dom)}</div>`;
  if (dom) h += `<h2>Domain</h2><div class="grid">${card('Registration', bad(dom.rd) ? err(dom.rd) : kv([['registrar', esc(dom.rd.registrar)], ['abuse', esc(dom.rd.abuse)], ['created', esc(dom.rd.created)], ['updated', esc(dom.rd.updated)], ['expires', esc(dom.rd.expires)],
    ['nameservers', dom.rd.ns.map(n => go(n)).join('<br>')], ['status', dom.rd.status.map(x => `<span class="pill">${esc(x)}</span>`).join('')]]))}
    ${card('Resolves to', kv([['A', dom.A.map(go).join('<br>') || '<span class="muted">none live</span>'], ['AAAA', (dom.AAAA || []).map(go).join('<br>')], ['NS', (dom.NS || []).map(go).join('<br>')]]) +
      (dom.fromPdns ? '<p class="note">No live A record, so the chain above uses the last IP from passive DNS.</p>' : '') + (dom.A.length > 1 ? '<p class="note">The chain above follows the first IP. Click another to pivot on it.</p>' : ''))}</div>`;
  h += `<h2>Details</h2><div class="grid">${ipCards(r)}</div>`;
  h += `<h2>Routing history for this address</h2><div class="flowbox">${bad(r.hist) ? err(r.hist) : svgTimeline(r.hist, r.cy && r.cy.asn)}</div>`;
  h += `<p class="note">Each row is one network announcing a block that covers this IP. Highlighted bars are the current host. A block that recently moved to a small host is worth noting.</p>`;
  const ic = intelCards(dom ? dom.ex : r.ex, !dom, dom ? dom.dom : r.ip); if (ic) h += `<h2>Threat intel</h2><div class="intel">${ic}</div>`;
  h += `<h2>Open elsewhere</h2>${linksIP(r.ip, !bad(r.cy) && r.cy.asn)}`;
  return h;
}

function renderASN(r) {
  const nm = r.name && r.name.name || '';
  const m = mainUp(r.up);
  let h = `<p class="summary"><b>AS${r.asn}</b> is <b>${esc(shortName(nm) || 'unnamed')}</b>${r.name.cc ? ` (${esc(r.name.cc)}, ${esc(r.name.reg)}, registered ${esc(r.name.alloc)})` : ''}. `;
  if (!bad(r.fp)) h += r.fp.v4 ? `It announces ${fmt(r.fp.v4)} IPv4 blocks covering ${fmt(r.fp.addrs)} addresses. ` : `It announces nothing right now, so it's dark. Run <span class="mono">rehome.py ${r.asn}</span> to see where its last blocks went. `;
  if (m) h += m.share >= .4 ? `<b>${esc(shortName(m.name))}</b> (AS${m.asn}) carries about ${Math.round(m.share * 100)}% of its visible routes, so that's the chokepoint.` : `Its routes are spread across ${r.up.ups.length}+ upstreams.`;
  h += '</p>';
  if (!bad(r.up) && r.up.ups.length) {
    const cols = [{k: 'Network', v: 'AS' + r.asn, hot: true, d: [shortName(nm), !bad(r.fp) ? `${r.fp.v4} IPv4 blocks` : '', `${r.up.nRight} customer networks`].filter(Boolean), cut: 'Abuse desk'},
      {stack: r.up.ups.slice(0, 6).map((u, i) => ({k: `${i ? 'Upstream' : 'Main upstream'} · ${Math.round(u.share * 100)}%`, v: 'AS' + u.asn, share: u.share, hot: !i && u.share >= .4, d: [shortName(u.name)], cut: !i && u.share >= .4 ? 'Transit cut' : ''}))},
      {k: 'Internet', v: '75k networks', d: ['global routing table']}];
    h += `<h2>How it reaches the internet</h2><div class="flowbox">${svgFlow(cols)}</div>`;
  }
  h += `<h2>Details</h2><div class="grid">`;
  h += card('Upstreams and peers', bad(r.up) ? err(r.up) : '<table><tr><th>network</th><th>name</th><th>share</th></tr>' + r.up.ups.map(u => `<tr><td>${go('AS' + u.asn)}</td><td>${esc(u.name)}</td><td class="mono">${Math.round(u.share * 100)}%</td></tr>`).join('') + '</table>' +
    `<p class="note">Share is the slice of route-collector sightings on each link. ${r.up.nLeft} upstream or peer links seen in total.</p>`);
  h += card('Abuse desk', bad(r.ab) ? err(r.ab) : (r.ab.length ? r.ab.map(esc).join('<br>') : '<span class="muted">none on file</span>'));
  if (!bad(r.fp)) h += card(`Announced blocks (${r.fp.list.length})`, '<table><tr><th>block</th><th>since</th></tr>' + r.fp.list.slice(0, 40).map(p => `<tr><td>${go(p.prefix.split('/')[0])} <span class="mono muted">/${p.prefix.split('/')[1]}</span></td><td class="mono">${esc(p.since || '')}</td></tr>`).join('') + '</table>');
  h += '</div>';
  if (!bad(r.hist)) {
    const rows = []; for (const o of r.hist.by_origin || []) for (const p of o.prefixes) for (const [s, e] of mergeSpans(p.timelines)) rows.push({origin: String(o.origin), prefix: p.prefix, first: s, last: e});
    const latest = rows.sort((a, b) => a.last < b.last ? 1 : -1).slice(0, 12).sort((a, b) => a.first < b.first ? -1 : 1);
    h += `<h2>Routing history (latest 12 blocks)</h2><div class="flowbox">${svgTimeline(latest, r.asn)}</div>`;
  }
  h += `<h2>Open elsewhere</h2><div class="links"><a href="https://bgp.tools/as/${r.asn}" target="_blank" rel="noopener noreferrer">bgp.tools ↗</a><a href="https://bgp.he.net/AS${r.asn}" target="_blank" rel="noopener noreferrer">bgp.he.net ↗</a><a href="https://stat.ripe.net/AS${r.asn}" target="_blank" rel="noopener noreferrer">RIPEstat ↗</a><a href="https://www.peeringdb.com/asn/${r.asn}" target="_blank" rel="noopener noreferrer">PeeringDB ↗</a></div>`;
  return h;
}

/* ---------- main ---------- */
function norm(q) { return q.trim().replace(/\[\.\]/g, '.').replace(/^hxxps?/i, 'http').replace(/^https?:\/\//i, '').split('/')[0].toLowerCase(); }
function kindOf(q) {
  if (/^\d+\.\d+\.\d+\.\d+$/.test(q) || (q.includes(':') && /^[0-9a-f:]+$/.test(q))) return 'ip';
  if (/^(as)?\d+$/.test(q)) return 'asn';
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(q)) return 'domain';
  return null;
}
let runId = 0;
async function pivot(raw) {
  const q = norm(raw); const k = kindOf(q); const id = ++runId;
  $('#q').value = defang(q);
  if (!k) { $('#out').innerHTML = '<p class="err">Enter an IP, a domain, or an ASN like AS13335.</p>'; return; }
  history.replaceState(null, '', '#' + encodeURIComponent(q));
  tickBox = $('#ticks'); tickBox.innerHTML = ''; $('#out').innerHTML = '<p class="note">Working…</p>';
  try {
    let h;
    if (k === 'ip') h = renderIP(await workIP(q));
    else if (k === 'asn') h = renderASN(await workASN(q.replace(/^as/, '')));
    else { const d = await workDomain(q); h = d.main ? renderIP(d.main, d) : `<p class="summary"><b>${esc(defang(q))}</b> doesn't resolve and no past IPs are on record.</p><div class="grid">${card('Registration', bad(d.rd) ? err(d.rd) : kv([['registrar', esc(d.rd.registrar)], ['created', esc(d.rd.created)], ['expires', esc(d.rd.expires)]]))}</div><div class="intel">${intelCards(d.ex, false, q)}</div>`; }
    if (id === runId) $('#out').innerHTML = h;
  } catch (e) { if (id === runId) $('#out').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-q]'); if (t) { e.preventDefault(); pivot(t.dataset.q); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  const rt = e.target.closest('[data-crt]'); if (rt) { rt.textContent = 'asking…'; getJSON(HELPER + '/api/crtsh?q=' + encodeURIComponent(rt.dataset.crt), 130000).then(x => { const el = document.getElementById('crtline'); el.outerHTML = bad(x) ? `<p class="quiet" id="crtline">crt.sh still isn’t answering. <button class="cp" data-crt="${esc(rt.dataset.crt)}">try again</button></p>` : `<div class="card"><h3>crt.sh</h3>${kv([['certs', x.certs]])}<table class="tight">${x.names.slice(0, 25).map(([n, d]) => `<tr><td class="mono">${esc(d)}</td><td>${go(n)}</td></tr>`).join('')}</table></div>`; }).catch(() => rt.textContent = 'try again'); return; }
  const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard.writeText(c.dataset.copy).then(() => { c.textContent = 'copied'; setTimeout(() => c.textContent = 'copy', 1200); }); }
});
$('#f').addEventListener('submit', e => { e.preventDefault(); pivot($('#q').value); });
pingHelper().then(() => { const h = decodeURIComponent(location.hash.slice(1)); if (h) pivot(h); });
</script>

<script>(function(){var b=document.getElementById('themeBtn');if(!b)return;b.onclick=function(){var n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';if(n==='light')document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('fk_theme',n)}catch(e){}var m=document.getElementById('tc');if(m)m.content=n==='light'?'#e0cfb0':'#1b1e1f';if(window.onFkTheme)window.onFkTheme(n)}})()</script>
<script>(function(){var bar=document.querySelector('.suitebar');if(!bar)return;
var grps=[].slice.call(bar.querySelectorAll('.grp'));
function shut(x){grps.forEach(function(g){if(g!==x)g.classList.remove('open')})}
grps.forEach(function(g){var b=g.querySelector('.gbtn');
  b.addEventListener('click',function(e){e.stopPropagation();var o=g.classList.contains('open');shut(null);if(!o)g.classList.add('open')})});
document.addEventListener('click',function(){shut(null)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')shut(null)});
})()</script>
