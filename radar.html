<title>Radar</title>
<link rel="manifest" href="manifest-radar.webmanifest">
<link rel="icon" href="radar-192.png">
<link rel="apple-touch-icon" href="radar-180.png">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="stylesheet" href="leaflet.css">
<style>
/* Opus Prima Materia. Radar: NOAA NEXRAD mosaic + single-site scans and NOAA HRRR model radar, tiles from the
   Iowa Environmental Mesonet; storm-based warnings from api.weather.gov. No keys, no tracking. */
:root{
  color-scheme:light;
  --bg:#e0cfb0; --card:#e8d9bf; --chip:#d4c29e; --raised:#eee1cb;
  --ink:#2b2114; --mut:#5f5236; --faint:#8a7c5e; --line:color-mix(in srgb,#1e160e 12%,transparent); --line2:color-mix(in srgb,#1e160e 24%,transparent);
  --acc:#b0631f; --good:#14776a; --bad:#b23e37; --blue:#2f6fb0;
  --h1:color-mix(in srgb,var(--acc),#000 26%); --h2:#3d6e63; --h3:#44618c; --h4:#71537f; --h5:#5c7150; --on-acc:#fffaf0;
  --mono:"SF Mono","JetBrains Mono","Menlo",ui-monospace,"Consolas",monospace;
}
:root:not([data-theme="light"]){
    --h1:color-mix(in srgb,var(--acc),#fff 16%); --h2:#7cb5a4; --h3:#8fa8c9; --h4:#ab8fc0; --h5:#97ab8a; --on-acc:#1b1e1f;
    --bg:#1b1e1f; --card:#222627; --chip:#292e2f; --raised:#2e3334;
    --ink:#e7e4d9; --mut:#b1afa1; --faint:#828175; --line:#353b3c; --line2:#434a4b;
    --acc:#d98a3d; --good:#4bbfa6; --bad:#d0655c; --blue:#5b9cff;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden}
button{font:inherit; cursor:pointer}
.suitebar{position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:10px; background:var(--card); border-bottom:1px solid var(--line); padding:7px 12px; margin:0; overflow-x:auto; scrollbar-width:none}
.suitebar::-webkit-scrollbar{display:none}
.suitebar .brand{font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.05em; color:var(--acc); text-decoration:none; white-space:nowrap; flex-shrink:0}
.suitebar .switch{display:flex; gap:3px}
.suitebar .switch a{font-family:var(--mono); font-size:12.5px; padding:5px 10px; border-radius:8px; color:var(--mut); text-decoration:none; white-space:nowrap}
.suitebar .switch a.on{background:var(--chip); color:var(--h1); box-shadow:inset 0 -2px 0 var(--acc)}
.suitebar .themebtn{margin-left:auto; position:sticky; right:0; flex-shrink:0; font-size:15px; line-height:1; padding:5px 9px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--mut); cursor:pointer; box-shadow:-10px 0 8px -2px var(--card)}
.suitebar .themebtn:hover{color:var(--acc); border-color:var(--line2)}

#map{flex:1; min-height:0; background:var(--chip); position:relative}
.leaflet-container{background:var(--chip); font:inherit}
.leaflet-control-attribution{font-size:10px!important; background:color-mix(in srgb,var(--card) 80%,transparent)!important; color:var(--faint)!important; border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card); color:var(--ink); border:1px solid var(--line2); box-shadow:0 10px 30px -12px rgba(0,0,0,.7)}
.leaflet-popup-content{margin:11px 13px; font-size:13px; line-height:1.45}
.leaflet-container a.leaflet-popup-close-button{color:var(--mut)}
.wpop b{display:block; font:700 12px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--c)}
.wpop .until{font:12px var(--mono); color:var(--mut); margin:2px 0 6px}
.wpop .area{color:var(--mut); font-size:12px}

.panel{position:absolute; z-index:500; background:color-mix(in srgb,var(--card) 88%,transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px -14px rgba(0,0,0,.7)}
#head{top:10px; left:10px; padding:10px 12px 11px; max-width:calc(100% - 76px)}
#head h1{font:700 16px var(--mono); letter-spacing:.05em; color:var(--h1); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
#head h1 small{font:500 11.5px var(--mono); letter-spacing:.02em; color:var(--mut)}
.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-top:9px}
.seg button{flex:1; border:0; background:var(--chip); color:var(--mut); font:600 12px var(--mono); padding:6px 10px; white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{color:var(--h1); box-shadow:inset 0 -2px 0 var(--acc)}
.seg button:disabled{opacity:.45; cursor:default}
.chip{margin-top:8px; border:1px solid var(--line); background:var(--chip); color:var(--mut); border-radius:99px; padding:4px 11px; font:600 11.5px var(--mono)}
.chip.on{color:var(--h1); border-color:color-mix(in srgb,var(--acc) 50%,transparent); background:color-mix(in srgb,var(--acc) 12%,var(--chip))}
body.vel #cleanBtn{display:none}
#tools{top:10px; right:10px; display:flex; flex-direction:column; gap:6px; padding:6px}
.tb{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--chip); color:var(--ink); font-size:16px; line-height:1; display:grid; place-items:center}
.tb:hover{border-color:var(--line2)}
.tb.on{color:var(--h1); box-shadow:inset 0 -2px 0 var(--acc)}
.tb.off{color:var(--faint)}

#dock{left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); padding:10px 14px 9px; max-width:760px; margin:0 auto}
.row1{display:flex; align-items:center; gap:12px}
#play{width:42px; height:42px; border-radius:50%; border:1px solid var(--line2); background:var(--chip); color:var(--h1); font-size:15px; flex-shrink:0; display:grid; place-items:center}
#play:hover{border-color:var(--acc)}
#when{min-width:0; flex:1}
#when b{display:block; font:700 20px var(--mono); letter-spacing:-.01em; font-variant-numeric:tabular-nums}
#when span{display:block; font-size:12.5px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#when span.fc{color:var(--h3)} #when span.warn{color:var(--bad)} #when span.pj{color:var(--h2)} #when span.bl{color:color-mix(in srgb,var(--h2) 50%,var(--h3))}
#spot{margin:-2px 0 9px; padding-bottom:9px; border-bottom:1px solid var(--line); display:grid; gap:5px}
#spot .ln{display:flex; gap:8px; align-items:baseline; font-size:13.5px; line-height:1.4}
#spot .ln i{font-style:normal; width:16px; flex-shrink:0; text-align:center; color:var(--h2)}
#spot .ln.soon i,#spot .ln.soon b{color:var(--acc)} #spot .ln.rain i{color:var(--h3)} #spot .ln.dry span{color:var(--mut)}
#spot .ln.storm i{color:var(--h3)} #spot .ln.storm.hail i{color:var(--acc)} #spot .ln.storm.rot i,#spot .ln.storm.rot b{color:var(--bad)}
#spot .mut{color:var(--mut)}
.arrow{width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:12px solid var(--c)}
#hz{margin-top:0; flex-shrink:0}
#hz button{padding:5px 8px; font-size:11.5px}
#track{position:relative; height:30px; margin-top:8px; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none}
#track .seg-p,#track .seg-f{position:absolute; top:13px; height:4px; border-radius:2px}
#track .seg-p{left:0; background:color-mix(in srgb,var(--mut) 55%,transparent)}
#track .seg-f{right:0; opacity:.85}
#track .tk{position:absolute; top:12px; width:2px; height:6px; margin-left:-1px; border-radius:1px; background:var(--faint); opacity:.7}
#track .tk.fc{background:var(--h3)} #track .tk.pj{background:var(--h2)} #track .tk.blend{background:color-mix(in srgb,var(--h2) 50%,var(--h3))} #track .tk.proj{background:var(--h2)} #track .tk.ld{opacity:1}
#track .nowmk{position:absolute; top:4px; width:2px; height:22px; margin-left:-1px; background:var(--acc); border-radius:1px}
#track .knob{position:absolute; top:7px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--h1); border:3px solid var(--card); box-shadow:0 0 0 1px var(--line2); transition:left .08s linear}
.tlabels{display:flex; justify-content:space-between; font:10.5px var(--mono); color:var(--faint); letter-spacing:.05em; text-transform:uppercase; margin-top:1px}
.tlabels .n{color:var(--acc)} .tlabels .f{color:var(--h3)} .tlabels .pj{color:var(--h2)}
.legend{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--mut); margin-top:7px; flex-wrap:wrap}
.legend i{flex:0 0 132px; height:7px; border-radius:4px}
.ramp{background:linear-gradient(90deg,#65aee4,#2c6fd6,#2ad32a,#0f8f0f,#f5ec2a,#f0b41c,#f07a14,#e61e1e,#a81414,#d833d8)}
.vramp{background:linear-gradient(90deg,#26e87a,#0b6b33,#555,#7a1414,#ff3b3b)}
.legend .src{margin-left:auto; color:var(--faint)}
#localbox{display:none}
body.local #track,body.local .tlabels,body.local #hz,body.local #play{display:none}
body.local #localbox{display:block}
.me{width:14px; height:14px; border-radius:50%; background:var(--acc); border:2px solid var(--bg); box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 28%,transparent)}
.site{font:700 10.5px var(--mono); color:var(--h3); background:var(--card); border:1px solid var(--line2); border-radius:6px; padding:1px 5px; white-space:nowrap}
@media(max-width:620px){
  #head{padding:8px 10px 9px} #head h1{font-size:14px} #head h1 small{display:none}
  .seg button{padding:6px 8px; font-size:11.5px}
  #dock{left:6px; right:6px; bottom:calc(6px + env(safe-area-inset-bottom)); padding:9px 11px 8px}
  #when b{font-size:18px}
  .legend .src{display:none}
}
</style>
</head>
<body>
<div class="suitebar">
  <a class="brand" href="./index.html">◆&nbsp;FIELD KIT</a>
  <div class="switch">
    <a href="./index.html">Weather</a>
    <a href="./radar.html" class="on">Radar</a>
    <a href="./markets.html">Markets</a>
    <a href="./debt.html">Debt</a>
    <a href="./intel.html">Grapevine</a>
    <a href="./chef.html">Chef</a>
    <a href="./ascii.html">ASCII</a>
    <a href="./tax.html">Tax</a>
    <a href="./mortgage.html">Mortgage</a>
    <a href="./scrub.html">Scrub</a>

  </div>
  <button class="themebtn" id="themeBtn" title="Light / dark" aria-label="Toggle light or dark mode">◐</button>
</div>

<div id="map">
  <div class="panel" id="head">
    <h1>RADAR <small id="place"></small></h1>
    <div class="seg" id="view">
      <button data-v="comp">Loop + forecast</button>
      <button data-v="refl" id="vRefl">Local</button>
      <button data-v="vel" id="vVel">Velocity</button>
    </div>
    <button class="chip" id="cleanBtn" title="Hide returns weaker than light rain: birds, insects, ground clutter. Turn off to see light snow or drizzle.">Hide clutter</button>
  </div>
  <div class="panel" id="tools">
    <button class="tb" id="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="tb" id="zout" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="tb" id="home" title="Back to my location" aria-label="Back to my location">◎</button>
    <button class="tb on" id="warnBtn" title="Storm warnings on the map" aria-label="Toggle storm warnings">⚠</button>
    <button class="tb on" id="tracksBtn" title="Storm tracks: where each storm is heading over the next hour" aria-label="Toggle storm tracks">➚</button>
  </div>
  <div class="panel" id="dock">
    <div id="spot" hidden></div>
    <div class="row1">
      <button id="play" title="Play / pause (space)" aria-label="Play or pause">▶</button>
      <div id="when"><b>–</b><span>Loading radar…</span></div>
      <div class="seg" id="hz"><button data-h="2">2 h</button><button data-h="6">6 h</button><button data-h="18">18 h</button></div>
    </div>
    <div id="track"></div>
    <div class="tlabels"><span id="tlPast">−50 min</span><span class="n">now</span><span class="f" id="tlFc">forecast</span></div>
    <div id="localbox"></div>
    <div class="legend" id="legend"><span>Light</span><i class="ramp"></i><span>Heavy</span><span class="src" id="srcNote">NOAA radar · HRRR model</span></div>
  </div>
</div>

<script src="leaflet.js"></script>
<script src="nowcast.js"></script>
<script>
'use strict';
const IEM='https://mesonet.agron.iastate.edu';
const tileURL=l=>`${IEM}/cache/tile.py/1.0.0/${l}/{z}/{x}/{y}.png`;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const HOME={lat:37.9748,lon:-87.5558,label:'Evansville, IN'};
const loc=store.get('fk_loc',HOME);                       // shared with the weather page
const dark=document.documentElement.getAttribute('data-theme')!=='light';
window.onFkTheme=()=>location.reload();                    // basemap is chosen at load
const pad=(n,w)=>String(n).padStart(w,'0');
const stamp=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1,2)+pad(d.getUTCDate(),2)+pad(d.getUTCHours(),2)+pad(d.getUTCMinutes(),2);
const t12=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function span(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?`${h} h${m?' '+m+' min':''}`:`${m} min`}

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false,minZoom:3,maxZoom:12,worldCopyJump:true}).setView([loc.lat,loc.lon],7);
map.createPane('radar').style.zIndex=350;
map.createPane('labels').style.zIndex=460; map.getPane('labels').style.pointerEvents='none';
const esri=n=>`https://services.arcgisonline.com/arcgis/rest/services/Canvas/${n}/MapServer/tile/{z}/{y}/{x}`;
L.tileLayer(esri(dark?'World_Dark_Gray_Base':'World_Light_Gray_Base'),{maxNativeZoom:16,attribution:'&copy; Esri, OpenStreetMap'}).addTo(map);
L.tileLayer(esri(dark?'World_Dark_Gray_Reference':'World_Light_Gray_Reference'),{pane:'labels',maxNativeZoom:16}).addTo(map);
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution('Radar NOAA NEXRAD, model NOAA HRRR, via <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">Iowa Environmental Mesonet</a> · warnings NWS');
L.marker([loc.lat,loc.lon],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[14,14],iconAnchor:[7,7]}),interactive:false,keyboard:false}).addTo(map);
$('#place').textContent=loc.label||'';
$('#zin').onclick=()=>map.zoomIn(); $('#zout').onclick=()=>map.zoomOut();
$('#home').onclick=()=>map.setView([loc.lat,loc.lon],Math.max(map.getZoom(),7));
// keep Leaflet's attribution clear of the dock
function fitDock(){const h=$('#dock').offsetHeight+16;const b=document.querySelector('.leaflet-bottom.leaflet-right');if(b)b.style.bottom=h+'px'}
new ResizeObserver(fitDock).observe($('#dock'));

const OP=dark?.74:.8;
/* Radar tiles are redrawn through a canvas so returns weaker than light rain can be dropped. In this palette those are
   the blues, cyans and grays (birds, insects, ground clutter, clear-air echo); light rain starts at green. */
let cleanOn=store.get('rd_clean',true);
const RadarLayer=L.GridLayer.extend({
  createTile(coords,done){
    const c=document.createElement('canvas'); c.width=c.height=256;
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{
      const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0);
      if(this.options.clean&&cleanOn){ try{
        const d=x.getImageData(0,0,256,256), p=d.data;
        const keep=new Uint8Array(65536);
        for(let k=0,i=0;k<65536;k++,i+=4){ if(!p[i+3])continue;
          const r=p[i],g=p[i+1],b=p[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
          if(!(b>=g||(mx-mn<40&&mx<210)))keep[k]=1; }
        // despeckle: rain is contiguous, clutter is scattered single pixels. Keep a pixel only with 3+ of its 8 neighbors.
        for(let y=0;y<256;y++)for(let xx=0;xx<256;xx++){ const k=y*256+xx; if(!keep[k]){p[k*4+3]=0;continue}
          let n=0; for(let dy=-1;dy<=1;dy++){const yy=y+dy; if(yy<0||yy>255)continue;
            for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue; const x2=xx+dx; if(x2<0||x2>255)continue; n+=keep[yy*256+x2]; }}
          if(n<3)p[k*4+3]=0; }
        x.putImageData(d,0,0);
      }catch(e){} }
      done(null,c);
    };
    img.onerror=()=>done(null,c);
    img.src=L.Util.template(this.options.url,coords);
    return c;
  }
});
function layer(name,native,clean=true){return new RadarLayer({url:tileURL(name),pane:'radar',opacity:0,maxNativeZoom:native,keepBuffer:1,clean})}

/* ---------- timeline: real radar, then the radar projected forward, then the model ----------
   0-60 min: the latest radar pushed along its measured motion (nowcast.js). 60-180 min: the projection fades into the
   HRRR model. Beyond 180 min: model only. Past frames are real NEXRAD composite scans. */
let frames=[], idx=-1, nowIdx=0, horizon=store.get('rd_h',2), playing=false, timer=null, compValid=null, hrrrInit=null;
let eng=null, engBusy=false, engErr='', projL=null, projCanvas=null, projCtx=null, projImg=null, projTau=null, lastSpot=null, hint='';
const PROJ_END=60, BLEND_END=180;
function modelFrame(t){
  if(!hrrrInit)return null;
  const F=Math.round((t-hrrrInit)/60000/15)*15; if(F<15||F>1080)return null;
  return {F,name:`hrrr::REFD-F${pad(F,4)}-${stamp(hrrrInit)}`,native:8};
}
async function buildFrames(){
  const [m,h]=await Promise.all([j(`${IEM}/data/gis/images/4326/USCOMP/n0q_0.json`), j(`${IEM}/data/gis/images/4326/hrrr/refd_0000.json`).catch(()=>null)]);
  compValid=new Date(m.meta.valid); hrrrInit=h?new Date(h.model_init_utc):null;
  const past=[];
  for(let k=50;k>=0;k-=5){
    const t=new Date(compValid-k*60000);
    past.push({kind:'past',t,name:k?`ridge::USCOMP-N0Q-${stamp(t)}`:'nexrad-n0q-900913',native:10});   // pinned by time; newest isn't pinnable yet
  }
  const fut=[], end=horizon*60, at=tau=>new Date(+compValid+tau*60000);
  for(let tau=10;tau<=Math.min(PROJ_END,end);tau+=10) fut.push({kind:'proj',tau,t:at(tau)});
  for(let tau=PROJ_END+15;tau<=Math.min(BLEND_END,end);tau+=15){ const mf=modelFrame(at(tau)); fut.push(Object.assign({kind:mf?'blend':'proj',tau,t:at(tau)},mf||{})) }
  if(end>BLEND_END){ const step=horizon>6?30:15; for(let tau=BLEND_END+step;tau<=end;tau+=step){ const mf=modelFrame(at(tau)); if(mf)fut.push(Object.assign({kind:'fc',tau,t:at(tau)},mf)) } }
  frames.forEach(f=>{ f.L&&map.removeLayer(f.L); f.fb&&map.removeLayer(f.fb) });
  frames=[...past,...fut]; nowIdx=past.length-1; vgrid=null;
  renderTrack();
  show(nowIdx);                                            // only the current frame loads at open
  eng=null; hint=''; buildEngine();                        // the projection builds in the background
}
async function buildEngine(){
  if(engBusy)return; engBusy=true; engErr=''; paintSpot();
  try{
    const c=map.getCenter(), home=map.getBounds().contains([loc.lat,loc.lon]);
    const ctr=home?{lat:loc.lat,lng:loc.lon}:c;
    if(!Nowcast.CONUS(ctr.lat,ctr.lng))throw new Error('outside US radar coverage');
    const sz=map.getSize(), span=Math.min(6,Math.max(3,Math.ceil(Math.max(sz.x,sz.y)*2**(7-map.getZoom())/256)+1));
    const nm=d=>`ridge::USCOMP-N0Q-${stamp(d)}`;
    eng=await Nowcast.build({lat:ctr.lat,lon:ctr.lng,z:7,span,clean:cleanOn,
      frames:{valid:compValid,names:[nm(new Date(compValid-20*60000)),nm(new Date(compValid-10*60000)),'nexrad-n0q-900913']}});
    setupProjLayer();
  }catch(e){ eng=null; engErr=e.message||'unavailable' }
  engBusy=false;
  if(idx>nowIdx)show(idx);
  paintSpot();

  if(v==='comp'){
    if(localL){map.removeLayer(localL);localL=null}
    if(siteMk){map.removeLayer(siteMk);siteMk=null}
    $('#legend').innerHTML='<span>Light</span><i class="ramp"></i><span>Heavy</span><span class="src">NOAA radar · HRRR model</span>';
    frames.forEach(f=>f.L&&f.L.setOpacity(0)); show(idx<0?nowIdx:idx);
  } else {
    frames.forEach(f=>{f.L&&f.L.setOpacity(0); f.fb&&f.fb.setOpacity(0)}); if(projL)projL.setOpacity(0); hideSmooth(); stop();
    showLocal();
  }
}
$$('#view button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
function syncClean(){ $('#cleanBtn').classList.toggle('on',cleanOn); $('#cleanBtn').textContent=cleanOn?'Clutter hidden':'Hide clutter'; }
$('#cleanBtn').onclick=()=>{ cleanOn=!cleanOn; store.set('rd_clean',cleanOn); syncClean();
  frames.forEach(f=>{ if(f.L){ f.ok=false; f.L.redraw() } }); if(localL&&localL.options.clean)localL.redraw(); eng=null; lastSpot=null; if(compValid)buildEngine(); };
syncClean();

/* ---------- storm-based warnings (polygons) ---------- */
const WARN={'Tornado Warning':'var(--bad)','Extreme Wind Warning':'var(--bad)','Severe Thunderstorm Warning':'var(--acc)',
  'Flash Flood Warning':'var(--good)','Snow Squall Warning':'var(--h3)','Special Marine Warning':'var(--h4)'};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim();
let warnL=null, warnOn=store.get('rd_warn',true);
async function loadWarnings(){
  if(!warnOn){ if(warnL){map.removeLayer(warnL);warnL=null} return }
  let d; try{ d=await j('https://api.weather.gov/alerts/active?event='+encodeURIComponent(Object.keys(WARN).join(','))) }catch(e){ return }
  const feats=(d.features||[]).filter(f=>f.geometry);
  if(warnL)map.removeLayer(warnL);
  warnL=L.geoJSON({type:'FeatureCollection',features:feats},{
    style:f=>{const c=css(WARN[f.properties.event]||'var(--h3)'), tor=/Tornado|Extreme/.test(f.properties.event);return {color:c,weight:tor?3:2,opacity:.95,fillColor:c,fillOpacity:tor?.16:.09}},
    onEachFeature:(f,l)=>{const p=f.properties, c=WARN[p.event]||'var(--h3)';
      l.bindPopup(`<div class="wpop" style="--c:${c}"><b>${esc(p.event)}</b><div class="until">until ${esc(t12(new Date(p.ends||p.expires)))}</div><div class="area">${esc((p.areaDesc||'').slice(0,160))}</div></div>`)}
  }).addTo(map);
}
$('#warnBtn').classList.toggle('on',warnOn); $('#warnBtn').classList.toggle('off',!warnOn);
$('#warnBtn').onclick=()=>{warnOn=!warnOn; store.set('rd_warn',warnOn); $('#warnBtn').classList.toggle('on',warnOn); $('#warnBtn').classList.toggle('off',!warnOn); loadWarnings()};

/* ---------- storm tracks: NOAA's per-storm tracking from every NEXRAD site ----------
   Each cell carries motion (drct = the direction it moves FROM, sknt = knots), hail probability and size,
   and mesocyclone / tornado vortex flags. Cells are advanced to now, de-duplicated across radars, drawn 60 min ahead. */
let cells=[], cellsAt=0, tracksOn=store.get('rd_tracks',true), trackL=null;
const COMPASS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass=deg=>COMPASS[Math.round(((deg%360)+360)%360/22.5)%16];
const KM_MI=0.621371;
function stepKm(lat,lon,headingDeg,km){const r=headingDeg*Math.PI/180;return [lat+km*Math.cos(r)/111.32, lon+km*Math.sin(r)/(111.32*Math.cos(lat*Math.PI/180))]}
function sevOf(c){ if((c.tvs&&c.tvs!=='NONE')||(c.meso&&c.meso!=='NONE'))return 'rot'; if(c.poh>=50||c.max_size>=1)return 'hail'; return 'plain' }
const SEVCOL={rot:'var(--bad)',hail:'var(--acc)',plain:'var(--h3)'};
async function loadCells(force){
  if(!tracksOn){ if(trackL){map.removeLayer(trackL);trackL=null} cells=[]; paintSpot(); return }
  if(!force&&cells.length&&Date.now()-cellsAt<9.5*60e3){ drawTracks(); return }
  try{
    const d=await j(`${IEM}/geojson/nexrad_attr.geojson`); cellsAt=Date.now();
    const now=Date.now(), raw=(d.features||[]).map(f=>Object.assign({},f.properties,{lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]}))
      .filter(c=>c.max_dbz>=40&&c.sknt>0&&now-Date.parse(c.valid)<25*60e3).sort((a,b)=>a.range-b.range);
    const kept=[];
    for(const c of raw){                                       // one storm seen by two radars: keep the closer radar's read
      c.to=(c.drct+180)%360; c.kmh=c.sknt*1.852;
      const [la,lo]=stepKm(c.lat,c.lon,c.to,c.kmh*(now-Date.parse(c.valid))/3.6e6); c.nlat=la; c.nlon=lo;
      if(!kept.some(k=>Math.hypot((k.nlat-la)*111.32,(k.nlon-lo)*111.32*Math.cos(la*Math.PI/180))<12))kept.push(c);
    }
    cells=kept;
  }catch(e){}
  drawTracks(); paintSpot();
}
function etaFor(c){                                          // closest approach to you within 90 minutes
  const kx=111.32*Math.cos(loc.lat*Math.PI/180), rx=(loc.lon-c.nlon)*kx, ry=(loc.lat-c.nlat)*111.32;
  const r=c.to*Math.PI/180, vx=c.kmh*Math.sin(r), vy=c.kmh*Math.cos(r), v2=vx*vx+vy*vy; if(!v2)return null;
  const t=(rx*vx+ry*vy)/v2; if(t<0||t>1.5)return null;
  const miss=Math.hypot(rx-vx*t,ry-vy*t); if(miss>16)return null;
  return {hours:t, miss, dist:Math.hypot(rx,ry), from:(Math.atan2(-rx,-ry)*180/Math.PI+360)%360};
}
function drawTracks(){
  if(trackL){map.removeLayer(trackL);trackL=null}
  if(!tracksOn||!cells.length)return;
  const z=map.getZoom(), bb=map.getBounds().pad(0.35), g=L.layerGroup();
  for(const c of cells){
    if(!bb.contains([c.nlat,c.nlon]))continue;
    const sev=sevOf(c); if(z<6&&sev==='plain')continue;
    const col=css(SEVCOL[sev]), pts=[0,15,30,45,60].map(m=>stepKm(c.nlat,c.nlon,c.to,c.kmh*m/60));
    L.polyline(pts,{color:col,weight:sev==='plain'?1.6:2.4,opacity:.9,dashArray:'5 5',interactive:false}).addTo(g);
    pts.slice(1,4).forEach(p=>L.circleMarker(p,{radius:2,color:col,weight:1,fillColor:col,fillOpacity:1,interactive:false}).addTo(g));
    L.marker(pts[4],{icon:L.divIcon({className:'',html:`<div class="arrow" style="--c:${col};transform:rotate(${c.to}deg)"></div>`,iconSize:[12,12],iconAnchor:[6,6]}),interactive:false,keyboard:false}).addTo(g);
    const eta=etaFor(c);
    const pop=`<div class="wpop" style="--c:${SEVCOL[sev]}"><b>Storm ${esc(c.storm_id)} · ${esc(c.nexrad)}</b>`+
      `<div class="until">moving ${compass(c.to)} at ${Math.round(c.kmh*KM_MI)} mph</div><div class="area">`+
      [c.poh>0?`Hail ${c.poh}% chance${c.max_size>0?`, up to ${c.max_size} in`:''}`:'No hail signal',
       c.meso&&c.meso!=='NONE'?'Rotation detected (mesocyclone)':'', c.tvs&&c.tvs!=='NONE'?'Tornado vortex signature':'',
       `Peak ${c.max_dbz} dBZ${c.top?`, tops ${c.top} kft`:''}`].filter(Boolean).join(' · ')+
      `</div>${eta?`<div class="until" style="color:var(--acc)">Reaches you about ${t12(new Date(Date.now()+eta.hours*3.6e6))}</div>`:''}</div>`;
    L.circleMarker([c.nlat,c.nlon],{radius:sev==='plain'?4:6,color:col,weight:2,fillColor:col,fillOpacity:.35}).bindPopup(pop).addTo(g);
  }
  trackL=g.addTo(map);
}
function storyForYou(){                                      // the storm most likely to reach you next
  if(!tracksOn||!cells.length)return null;
  let best=null;
  for(const c of cells){ const e=etaFor(c); if(e&&(!best||e.hours<best.e.hours))best={c,e} }
  if(!best)return null;
  const {c,e}=best, sev=sevOf(c), at=t12(new Date(Date.now()+e.hours*3.6e6));
  const flag=sev==='rot'?', showing rotation':sev==='hail'?`, hail possible (${c.poh}%)`:'';
  return {sev, html:`Storm ${Math.round(e.dist*KM_MI)} mi ${compass(e.from)}, moving ${compass(c.to)} at ${Math.round(c.kmh*KM_MI)} mph${esc(flag)}. Reaches you about <b>${at}</b>.`};
}
$('#tracksBtn').classList.toggle('on',tracksOn); $('#tracksBtn').classList.toggle('off',!tracksOn);
$('#tracksBtn').onclick=()=>{ tracksOn=!tracksOn; store.set('rd_tracks',tracksOn); $('#tracksBtn').classList.toggle('on',tracksOn); $('#tracksBtn').classList.toggle('off',!tracksOn); loadCells(true) };

/* ---------- boot + refresh ---------- */
(async()=>{
  try{ await buildFrames() }catch(e){ $('#when').innerHTML=`<b>–</b><span class="warn">Radar unavailable (${esc(e.message)})</span>` }
  setView(view);
  loadWarnings(); loadCells(); fitDock();
})();
setInterval(async()=>{                                   // new radar every ~5 min, new model run hourly
  if(playing||dragging)return;
  try{
    const m=await j(`${IEM}/data/gis/images/4326/USCOMP/n0q_0.json`);
    if(+new Date(m.meta.valid)!==+compValid){const atNow=idx===nowIdx; await buildFrames(); if(!atNow)show(nowIdx)}
  }catch(e){}
  if(view!=='comp')showLocal();
  loadWarnings();
  if(document.visibilityState==='visible')loadCells();      // the storm feed is ~0.5 MB, so it refreshes every 10 min
},120000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
