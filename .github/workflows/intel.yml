# Refreshes intel.json for the Grapevine page. GitHub starts scheduled runs late on small repos
# (hours, observed), so the times below sit well ahead of when the data is wanted:
#   04:15 + 08:15 UTC  -> fresh before and just after 5am Central
#   13:15 + 17:15 UTC  -> fresh for early afternoon Central
#   22:15 UTC          -> evening catch-up
# Also runs on edits to the fetcher or feed list, or by hand from the Actions tab.
name: Intel

on:
  schedule:
    - cron: "15 4,8,13,17,22 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/intel.yml", "intel-fetch.py", "intel-feeds.json", "macro-fetch.py", "congress-fetch.py"]

permissions:
  contents: write

concurrency:
  group: "intel"
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # higher API rate limit for the adds-only IOC repos
        run: python3 intel-fetch.py
      - name: House disclosure filings for the Markets board
        timeout-minutes: 6
        continue-on-error: true
        run: python3 congress-fetch.py
      - name: GDP, population and world debt for the Debt page
        timeout-minutes: 6            # a slow source must never hold up the feeds
        continue-on-error: true
        run: python3 macro-fetch.py
      - name: Commit intel.json
        run: |
          git config user.name "field-kit-bot"
          git config user.email "field-kit-bot@users.noreply.github.com"
          git add intel.json
          [ -f macro.json ] && git add macro.json || true
          [ -f congress.json ] && git add congress.json || true
          git diff --cached --quiet && exit 0
          git commit -q -m "intel: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep 7; done; exit 1
