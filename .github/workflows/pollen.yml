# Pulls the pollen.com allergy forecast for the whole US (one ZIP per 3-digit prefix) into pollen.json
# so the weather page can read it same-origin. pollen.com only answers requests that
# carry its own referrer, which a browser cannot set, so the fetch lives here instead.
# Runs every 6 hours, on edits to this file, or by hand from the Actions tab.
name: Pollen

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/pollen.yml", "pollen-fetch.py", "zipgrid.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pollen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pollen.com (one ZIP per 3-digit prefix, see zipgrid.json)
        run: python3 pollen-fetch.py

      - name: Commit pollen.json
        run: |
          git config user.name "field-kit-bot"
          git config user.email "field-kit-bot@users.noreply.github.com"
          git add pollen.json
          git diff --cached --quiet || git commit -m "pollen: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5
